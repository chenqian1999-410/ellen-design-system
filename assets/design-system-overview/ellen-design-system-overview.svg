<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <style>
      .display { font-family: "Songti SC", "STSong", Georgia, serif; fill: #20211E; }
      .sans { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; fill: #20211E; }
      .mono { font-family: Menlo, Monaco, monospace; fill: #20211E; letter-spacing: 1.5px; }
      .meta { font-size: 13px; font-weight: 700; }
      .small { font-size: 15px; }
      .body { font-size: 18px; }
      .label { font-size: 17px; font-weight: 700; }
      .section { font-size: 27px; font-weight: 600; }
      .hair { stroke: #CFC5B5; stroke-width: 1.3; }
      .light { fill: #FFFAF0; }
      .board-muted { fill: #DDE4DD; }
      .yellow-ink { fill: #F2D977; }
    </style>
    <filter id="paperShadow" x="-20%" y="-20%" width="150%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#3F301E" flood-opacity="0.13"/>
    </filter>
    <filter id="hardShadow" x="-20%" y="-20%" width="150%" height="160%">
      <feDropShadow dx="6" dy="6" stdDeviation="0" flood-color="#E96145" flood-opacity="0.95"/>
    </filter>
  </defs>

  <image xlink:href="paper-background.png" x="0" y="0" width="1080" height="1920" preserveAspectRatio="xMidYMid slice"/>

  <!-- Header -->
  <rect x="78" y="74" width="294" height="44" fill="#F2D977" stroke="#20211E" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="98" y="102" class="mono meta">ELLEN DESIGN SYSTEM · 01</text>
  <text x="78" y="194" class="display" font-size="68" font-weight="600">编辑式田野笔记</text>
  <text x="80" y="237" class="sans" font-size="21" fill="#696861">温暖的手工触感 × 严谨的产品证据</text>
  <line x1="80" y1="267" x2="172" y2="267" stroke="#E96145" stroke-width="8"/>
  <text x="904" y="102" class="mono meta" text-anchor="end" fill="#696861">FIELD NOTES / 2026</text>

  <!-- Brand core board -->
  <g filter="url(#paperShadow)">
    <rect x="70" y="305" width="940" height="176" fill="#25332B"/>
  </g>
  <text x="105" y="345" class="mono meta yellow-ink">BRAND CORE / 品牌核心</text>
  <text x="105" y="399" class="display light" font-size="36">具有产品严谨性的田野笔记</text>
  <text x="105" y="438" class="sans body board-muted">表层温暖、有探索感；底层结构清晰、编号明确、判断可验证。</text>
  <g class="sans small" font-weight="700">
    <rect x="720" y="335" width="112" height="34" fill="#E96145"/><text x="776" y="358" text-anchor="middle" fill="#FFFAF0">证据导向</text>
    <rect x="842" y="335" width="112" height="34" fill="#4D73C8"/><text x="898" y="358" text-anchor="middle" fill="#FFFAF0">跨学科</text>
    <rect x="720" y="382" width="112" height="34" fill="#F2D977"/><text x="776" y="405" text-anchor="middle">温暖</text>
    <rect x="842" y="382" width="112" height="34" fill="#DFE8D6"/><text x="898" y="405" text-anchor="middle">好奇</text>
  </g>

  <!-- Color system -->
  <text x="75" y="538" class="mono meta" fill="#E96145">01 / COLOR TOKENS</text>
  <text x="75" y="579" class="display section">颜色承担语义，而不是装饰</text>
  <text x="890" y="572" class="display" font-size="42" font-style="italic" fill="#E96145" text-anchor="end">75–85%</text>
  <text x="894" y="595" class="sans small" fill="#696861" text-anchor="end">纸张与墨色占比</text>
  <g class="sans small">
    <g><rect x="75" y="624" width="112" height="70" fill="#F5F0E7" stroke="#CFC5B5"/><text x="87" y="651">paper</text><text x="87" y="678" class="mono" font-size="12">#F5F0E7</text></g>
    <g><rect x="198" y="624" width="112" height="70" fill="#FFFAF0" stroke="#CFC5B5"/><text x="210" y="651">paper-2</text><text x="210" y="678" class="mono" font-size="12">#FFFAF0</text></g>
    <g><rect x="321" y="624" width="112" height="70" fill="#20211E"/><text x="333" y="651" fill="#FFFAF0">ink</text><text x="333" y="678" class="mono" font-size="12" fill="#FFFAF0">#20211E</text></g>
    <g><rect x="444" y="624" width="112" height="70" fill="#4D73C8"/><text x="456" y="651" fill="#FFFAF0">blue</text><text x="456" y="678" class="mono" font-size="12" fill="#FFFAF0">#4D73C8</text></g>
    <g><rect x="567" y="624" width="112" height="70" fill="#637554"/><text x="579" y="651" fill="#FFFAF0">green</text><text x="579" y="678" class="mono" font-size="12" fill="#FFFAF0">#637554</text></g>
    <g><rect x="690" y="624" width="112" height="70" fill="#E96145"/><text x="702" y="651" fill="#FFFAF0">coral</text><text x="702" y="678" class="mono" font-size="12" fill="#FFFAF0">#E96145</text></g>
    <g><rect x="813" y="624" width="112" height="70" fill="#F2D977"/><text x="825" y="651">yellow</text><text x="825" y="678" class="mono" font-size="12">#F2D977</text></g>
  </g>
  <text x="75" y="723" class="sans small" fill="#696861">珊瑚红＝行动｜分析蓝＝系统｜稳定绿＝流程｜便签黄＝高亮</text>

  <!-- Typography and layout -->
  <text x="75" y="788" class="mono meta" fill="#4D73C8">02 / TYPE &amp; RHYTHM</text>
  <g filter="url(#paperShadow)">
    <rect x="70" y="813" width="462" height="300" fill="#FFFAF0" fill-opacity="0.94" stroke="#CFC5B5"/>
    <rect x="550" y="813" width="460" height="300" fill="#FFFAF0" fill-opacity="0.94" stroke="#CFC5B5"/>
  </g>
  <text x="100" y="858" class="display" font-size="34">三级字体，建立编辑感</text>
  <text x="100" y="918" class="display" font-size="38">展示标题 / 宋体衬线</text>
  <text x="100" y="959" class="sans body">正文与 UI / 清晰无衬线</text>
  <text x="100" y="1001" class="mono meta">META / EVIDENCE / SOURCE 01</text>
  <line x1="100" y1="1033" x2="500" y2="1033" class="hair"/>
  <text x="100" y="1067" class="sans small" fill="#696861">中文讲解释，英文只做短标签与章节签名。</text>

  <text x="580" y="858" class="display" font-size="34">双栏节奏 + 28px 网格</text>
  <rect x="580" y="895" width="235" height="118" fill="#F7D8CB" stroke="#20211E"/>
  <rect x="830" y="895" width="140" height="118" fill="#DCE5FF" stroke="#20211E"/>
  <text x="697" y="960" class="mono label" text-anchor="middle">1.28fr</text>
  <text x="900" y="960" class="mono label" text-anchor="middle">.72fr</text>
  <line x1="580" y1="1036" x2="970" y2="1036" stroke="#CFC5B5" stroke-width="1.3" stroke-dasharray="6 5"/>
  <text x="580" y="1071" class="sans small" fill="#696861">留白优先；重要对象允许偏离网格几像素。</text>

  <!-- Collage grammar -->
  <text x="75" y="1180" class="mono meta" fill="#637554">03 / COLLAGE GRAMMAR</text>
  <text x="75" y="1221" class="display section">六个功能角色，组成可信拼贴</text>
  <text x="927" y="1214" class="mono meta" text-anchor="end" fill="#696861">ROTATION ±3°</text>
  <g class="sans">
    <g><rect x="75" y="1255" width="292" height="92" fill="#FFFAF0" stroke="#CFC5B5"/><text x="95" y="1286" class="mono meta" fill="#E96145">01</text><text x="135" y="1288" class="label">基础纸张</text><text x="95" y="1320" class="small" fill="#696861">象牙纸面＋淡制图网格</text></g>
    <g><rect x="382" y="1255" width="292" height="92" fill="#FFFAF0" stroke="#CFC5B5"/><text x="402" y="1286" class="mono meta" fill="#E96145">02</text><text x="442" y="1288" class="label">主要标本</text><text x="402" y="1320" class="small" fill="#696861">肖像、截图、图表或核心信息</text></g>
    <g><rect x="689" y="1255" width="292" height="92" fill="#FFFAF0" stroke="#CFC5B5"/><text x="709" y="1286" class="mono meta" fill="#E96145">03</text><text x="749" y="1288" class="label">固定线索</text><text x="709" y="1320" class="small" fill="#696861">胶带、别针、夹子或边框</text></g>
    <g><rect x="75" y="1362" width="292" height="92" fill="#FFFAF0" stroke="#CFC5B5"/><text x="95" y="1393" class="mono meta" fill="#4D73C8">04</text><text x="135" y="1395" class="label">证据线索</text><text x="95" y="1427" class="small" fill="#696861">图注、编号、指标与来源</text></g>
    <g><rect x="382" y="1362" width="292" height="92" fill="#FFFAF0" stroke="#CFC5B5"/><text x="402" y="1393" class="mono meta" fill="#4D73C8">05</text><text x="442" y="1395" class="label">人情线索</text><text x="402" y="1427" class="small" fill="#696861">短批注、水彩 IP 或印章</text></g>
    <g><rect x="689" y="1362" width="292" height="92" fill="#FFFAF0" stroke="#CFC5B5"/><text x="709" y="1393" class="mono meta" fill="#4D73C8">06</text><text x="749" y="1395" class="label">编辑框架</text><text x="709" y="1427" class="small" fill="#696861">清晰对齐与足够留白</text></g>
  </g>

  <!-- Component strip -->
  <text x="75" y="1521" class="mono meta" fill="#E96145">04 / COMPONENT LIBRARY</text>
  <rect x="70" y="1547" width="940" height="157" fill="#25332B"/>
  <text x="102" y="1588" class="display light" font-size="28">把推理和证据设计成“看得见的对象”</text>
  <g class="sans small" font-weight="700">
    <rect x="102" y="1622" width="126" height="42" fill="#F2D977"/><text x="165" y="1649" text-anchor="middle">首屏 / 封面</text>
    <rect x="240" y="1622" width="126" height="42" fill="#F7D8CB"/><text x="303" y="1649" text-anchor="middle">项目案例卡</text>
    <rect x="378" y="1622" width="126" height="42" fill="#DCE5FF"/><text x="441" y="1649" text-anchor="middle">证据卡</text>
    <rect x="516" y="1622" width="126" height="42" fill="#DFE8D6"/><text x="579" y="1649" text-anchor="middle">时间线</text>
    <rect x="654" y="1622" width="126" height="42" fill="#FFFAF0"/><text x="717" y="1649" text-anchor="middle">方法展板</text>
    <rect x="792" y="1622" width="126" height="42" fill="#E96145"/><text x="855" y="1649" text-anchor="middle" fill="#FFFAF0">联系页脚</text>
  </g>

  <!-- Guardrails -->
  <text x="75" y="1772" class="mono meta" fill="#637554">05 / MOTION, ACCESSIBILITY &amp; GUARDRAILS</text>
  <g filter="url(#hardShadow)">
    <rect x="70" y="1795" width="940" height="82" fill="#FFFAF0" stroke="#20211E" stroke-width="1.5"/>
  </g>
  <text x="98" y="1827" class="sans label">✓ 200–700ms 平静动效　✓ 保留键盘焦点与阅读顺序　✓ 证据真实，不编数字</text>
  <text x="98" y="1859" class="sans label" fill="#E96145">× 霓虹渐变　× 玻璃拟态　× 过量贴纸　× 每个元素都倾斜、描边、投影</text>

  <text x="74" y="1903" class="mono" font-size="11" fill="#696861">QIAN CHEN · AI PRODUCT FIELD NOTES · SYSTEM MAP V1</text>
  <text x="1007" y="1903" class="mono" font-size="11" fill="#696861" text-anchor="end">SOURCE: references/design-system.md</text>
</svg>
